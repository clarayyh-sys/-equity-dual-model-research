market: "CN_A"
frequency: "1d"   # 1d | 1m | ...
universe:
  type: "CSI300"  # CSI300 | ZZ500 | ALL | CUSTOM
  custom_list_path: null

data_source:
  name: "akshare" # akshare | tushare | local_csv
  tushare_token: null
  local_csv_dir: null

label:
  horizon_days: 5
  target: "future_return"  # future_return | excess_return | up_down

features:
  price_features: true
  volume_features: true
  technical_indicators: true

model:
  name: "lightgbm"
  params:
    objective: "regression"
    n_estimators: 2000
    learning_rate: 0.03
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8

backtest:
  rebalance: "W"   # D/W/M
  topk: 30
  max_weight: 0.05
  fee_bps: 5
  slippage_bps: 5
  limit_up_down: true
  exclude_st: true
  exclude_suspended: true
